# GitHub AI Repository Analytics - dbt Project Configuration
name: 'github_analytics'
version: '1.0.0'
config-version: 2

profile: 'github_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  github_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  ai_ml_topics: [
    'machine-learning', 'deep-learning', 'artificial-intelligence',
    'nlp', 'computer-vision', 'reinforcement-learning',
    'llm', 'transformers', 'ai', 'ml', 'data-science',
    'neural-network', 'tensorflow', 'pytorch', 'keras',
    'scikit-learn', 'huggingface', 'openai', 'langchain',
    'llama', 'gpt', 'bert', 'diffusion', 'gan', 'rl'
  ]

seeds:
  github_analytics:
    +schema: seeds
    +materialized: table